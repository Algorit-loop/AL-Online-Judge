<style>
    .gt-section {
        background: #f9f9f9; border: 1px solid #ddd;
        border-radius: 6px; padding: 1.2em 1.5em; margin-bottom: 1.2em;
    }
    .gt-section h3 {
        margin-top: 0; color: #333;
        border-bottom: 1px solid #e0e0e0;
        padding-bottom: 0.5em; margin-bottom: 1em;
    }

    /* ── Config bar (compact) ── */
    .gt-config {
        display: flex; gap: 1.5em; align-items: center; flex-wrap: wrap;
        background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px;
        padding: 0.7em 1.2em; margin-bottom: 1.2em;
    }
    .gt-config-item { display: flex; align-items: center; gap: 0.5em; }
    .gt-config-item label { font-weight: 600; font-size: 0.9em; white-space: nowrap; margin: 0; }
    .gt-config-item input[type="number"] {
        width: 70px; padding: 0.3em 0.5em; font-size: 0.95em;
        border: 1px solid #ccc; border-radius: 4px;
    }
    .gt-config-item select {
        padding: 0.3em 0.5em; font-size: 0.95em;
        border: 1px solid #ccc; border-radius: 4px; min-width: 180px;
    }
    .gt-config-item .gt-help { color: #999; font-size: 0.8em; }

    /* ACE editors */
    #ace_generator { width: 100%; height: 500px; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; }
    #ace_solution  { width: 100%; height: 400px; border: 1px solid #ccc; border-radius: 4px; }

    .gt-io-note {
        background: #fff8e1; border-left: 4px solid #f0ad4e;
        padding: 0.6em 1em; border-radius: 0 4px 4px 0;
        margin-bottom: 1em; font-size: 0.92em; color: #555;
    }

    /* Buttons */
    .gt-btn { border: none; padding: 0.6em 2em; font-size: 1.05em; border-radius: 4px; cursor: pointer; }
    .gt-btn:disabled { background: #999 !important; cursor: not-allowed; }
    .gt-btn-success { background: #00a65a; color: #fff; }
    .gt-btn-success:hover:not(:disabled) { background: #008d4c; }
    .gt-btn-ai { background: #8e44ad; color: #fff; font-size: 0.85em; padding: 0.35em 0.9em; border: none; border-radius: 4px; cursor: pointer; }
    .gt-btn-ai:hover:not(:disabled) { background: #7d3c98; }
    .gt-btn-primary { background: #3c8dbc; color: #fff; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; padding: 0.6em 1.5em; }
    .gt-btn-primary:hover { background: #2a6d94; color: #fff; text-decoration: none; }

    /* AI inline selects */
    .gt-ai-select {
        padding: 0.25em 0.4em; font-size: 0.85em;
        border: 1px solid #ccc; border-radius: 4px; max-width: 200px;
    }

    /* Error (form validation only — the progress panel below has its own .gt-result styling) */
    .gt-error {
        display: none; background: #fdd; border: 1px solid #c00;
        border-radius: 4px; padding: 0.8em 1em; color: #900; margin-top: 1em;
        white-space: pre-wrap; word-break: break-word;
    }

    /* AI messages */
    .gt-ai-msg { font-size: 0.85em; margin-top: 0.3em; }
    .gt-ai-msg.error { color: #c00; }
    .gt-ai-msg a { color: #3c8dbc; }

    /* ══════════════════════════════════════════════════════════════
       Progress panel
       ══════════════════════════════════════════════════════════════ */
    .gt-progress-card {
        background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
        padding: 1.6em 1.8em 1.9em; margin-bottom: 1.2em;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 6px rgba(16, 24, 40, 0.06);
    }
    .gt-progress-head { display: flex; align-items: center; gap: 0.65em; margin-bottom: 1.5em; }
    .gt-progress-head-icon {
        width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
        background: linear-gradient(135deg, #3c8dbc, #2a6d94); color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 0.85em;
    }
    .gt-progress-head h3 { margin: 0; border: none; padding: 0; font-size: 1.1em; color: #263238; }

    /* Stepper — horizontal timeline with connecting rail */
    .gt-stepper {
        list-style: none; padding: 0; margin: 0 0 1.6em; display: flex; align-items: flex-start;
    }
    .gt-stepper li {
        flex: 1; position: relative; text-align: center; padding: 0 0.4em; min-width: 0;
    }
    .gt-stepper li::before, .gt-stepper li::after {
        content: ''; position: absolute; top: 18px; height: 3px; background: #e5e7eb;
        transition: background 0.4s ease; z-index: 0;
    }
    .gt-stepper li::before { left: 0; width: 50%; }
    .gt-stepper li::after  { right: 0; width: 50%; }
    .gt-stepper li:first-child::before, .gt-stepper li:last-child::after { display: none; }
    .gt-stepper li.done::before, .gt-stepper li.done::after,
    .gt-stepper li.active::before, .gt-stepper li.error::before { background: #00a65a; }

    .gt-step-icon {
        position: relative; z-index: 1; margin: 0 auto;
        width: 38px; height: 38px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.85em; font-weight: 700;
        background: #fff; border: 3px solid #e2e5e9; color: #aab2bc;
        transition: all 0.35s cubic-bezier(.4,0,.2,1);
    }
    .gt-stepper li.done .gt-step-icon   { border-color: #00a65a; background: #00a65a; color: #fff; }
    .gt-stepper li.active .gt-step-icon {
        border-color: #3c8dbc; color: #3c8dbc;
        box-shadow: 0 0 0 5px rgba(60, 141, 188, 0.14);
        animation: gt-pulse 1.6s ease-in-out infinite;
    }
    .gt-stepper li.error .gt-step-icon  {
        border-color: #e74c3c; background: #e74c3c; color: #fff;
        box-shadow: 0 0 0 5px rgba(231, 76, 60, 0.14);
    }
    @keyframes gt-pulse {
        0%, 100% { box-shadow: 0 0 0 5px rgba(60, 141, 188, 0.14); }
        50%      { box-shadow: 0 0 0 9px rgba(60, 141, 188, 0.04); }
    }

    .gt-step-text { margin-top: 0.55em; }
    .gt-step-label { font-weight: 600; font-size: 0.85em; color: #667085; transition: color 0.3s; }
    .gt-stepper li.active .gt-step-label { color: #3c8dbc; }
    .gt-stepper li.done .gt-step-label   { color: #00a65a; }
    .gt-stepper li.error .gt-step-label  { color: #e74c3c; }
    .gt-step-detail { font-size: 0.76em; color: #98a2b3; margin-top: 0.2em; min-height: 1.1em; }

    .gt-step-bar {
        height: 4px; background: #eef0f3; border-radius: 2px;
        margin: 0.5em auto 0; max-width: 110px; overflow: hidden; display: none;
    }
    .gt-step-bar .bar { height: 100%; width: 0%; border-radius: 2px; transition: width 0.3s; background: #3c8dbc; }
    .gt-stepper li.active .gt-step-bar, .gt-stepper li.done .gt-step-bar { display: block; }
    .gt-stepper li.active .gt-step-bar .bar {
        background: linear-gradient(90deg, #3c8dbc 25%, #7ec1e8 50%, #3c8dbc 75%);
        background-size: 200% 100%; animation: gt-shimmer 1.3s linear infinite;
    }
    .gt-stepper li.done .gt-step-bar .bar { width: 100% !important; background: #00a65a; }
    @keyframes gt-shimmer { from { background-position: 0 0; } to { background-position: -200% 0; } }

    @media (max-width: 700px) {
        .gt-stepper { flex-direction: column; gap: 1.1em; }
        .gt-stepper li { display: flex; align-items: center; gap: 0.9em; text-align: left; padding: 0; }
        .gt-stepper li::before, .gt-stepper li::after { display: none; }
        .gt-step-text { margin-top: 0; flex: 1; }
        .gt-step-bar { margin: 0.4em 0 0; max-width: none; }
    }

    /* Result cards (success / error) */
    .gt-result {
        display: none; border-radius: 8px; padding: 1em 1.2em; margin-top: 0.4em;
        gap: 0.7em; align-items: flex-start;
    }
    .gt-result.show { display: flex; }
    .gt-result-icon { font-size: 1.35em; line-height: 1.2; margin-top: 0.05em; flex-shrink: 0; }
    .gt-result-body { flex: 1; min-width: 0; }
    .gt-result-title { font-weight: 700; font-size: 1.02em; }
    .gt-result-sub { font-size: 0.86em; margin-top: 0.25em; opacity: 0.9; }
    .gt-result-msg { white-space: pre-wrap; word-break: break-word; }
    .gt-result-success { background: #eafaf1; border: 1px solid #a6e4bd; color: #146c2e; }
    .gt-result-success .gt-result-icon { color: #00a65a; }
    .gt-result-error { background: #fdedec; border: 1px solid #f3b3ac; color: #7a241a; }
    .gt-result-error .gt-result-icon { color: #e74c3c; }

    /* Error log box */
    .gt-error-log {
        display: none; background: #1e2530; color: #e8eaed;
        font-family: 'Courier New', monospace; font-size: 0.82em;
        padding: 0.9em 1.1em; border-radius: 8px; margin-top: 0.8em;
        max-height: 260px; overflow-y: auto; white-space: pre-wrap;
        word-break: break-all;
    }

    /* Progress actions */
    .gt-progress-actions {
        margin-top: 1.4em; gap: 0.8em; align-items: center; flex-wrap: wrap;
    }
</style>
